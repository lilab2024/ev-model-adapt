# Physics models and their calibration.
# Parameter spec: [low, high] = calibrated within bounds; single value = fixed.
idm:
  params:
    v0: [25.0, 60.0]     # desired speed (m/s)
    T: [0.3, 4.0]        # desired time gap (s)
    s0: [0.5, 15.0]      # standstill gap (m)
    a: [0.2, 4.0]        # maximum acceleration (m/s2)
    b: [0.01, 6.0]       # 'comfortable deceleration' (m/s2); in closed-loop fits it mainly
                         # sets the sensitivity to the closing speed, hence the low bound
    delta: 4.0           # free-road exponent (fixed, usual value)
  min_gap_m: 0.1         # gaps below this value are clipped inside the model

# One-step least squares on pooled training samples
calibration:
  target: forward_difference   # (v_f[k+1] - v_f[k]) / dt, consistent with the simulation
  samples_per_task: 3000       # the same number of samples from every task (equal weight)
  n_starts: 5                  # multi-start: midpoint of the bounds + random starts
  seed: 42

# Simulation-based (closed-loop) calibration (D012)
sim_calibration:
  segment_s: 60.0            # segments cut from training runs; shorter runs are used whole
  segments_per_task: 20      # the same number of segments from every training task
  collision_cost_m: 100.0    # cost of a segment whose simulation collides
  optimizer:                 # scipy.optimize.differential_evolution
    popsize: 15
    maxiter: 50
    tol: 1.0e-4
    polish: true             # final local refinement of the best parameter set
  seed: 42

# M2: population prior (D016). Prior = mean and spread of log IDM parameters over the
# training tasks of a fold (each fitted on its own training runs). The context fit adds
# lambda * mean(z^2) to the spacing cost (z = standardized log-parameter deviation).
population_prior:
  lambdas_m: [0.3, 1.0, 3.0]   # candidate weights (m); chosen per fold by pseudo-tests
  pseudo_tasks: 4              # training tasks used as pseudo-test tasks
  pseudo_context_s: [10, 60]   # context lengths of the pseudo-tests
  min_log_std: 0.05            # floor of the prior standard deviation (log scale)
  min_tasks_for_selection: 3   # fewer training tasks: use the middle lambda, no pseudo-test
  seed: 42
