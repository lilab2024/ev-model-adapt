# Pretraining of the M4 network on synthetic IDM vehicles (D017). No real data are used,
# so the pretrained network is shared by all folds.

synthetic:
  n_vehicles: 4000            # virtual vehicles (one IDM parameter set each)
  runs_per_vehicle: 3         # runs per vehicle, each behind its own leader profile
  run_s: 60.0                 # length of a run (s)
  leader:
    base_speed_mps: [12.0, 30.0]   # cruise speed; capped at 0.9 * v0 of the follower
    kinds: [dip, osc, step]        # speed dip (as in the EV runs), oscillation, steps
    dip_depth_frac: [0.2, 1.0]     # share of the cruise speed removed (1.0 = stop)
    dip_start_s: [5.0, 20.0]
    hold_s: [0.0, 10.0]            # time at the lowest speed
    osc_amplitude_mps: [1.0, 5.0]
    osc_period_s: [10.0, 40.0]
    step_size_mps: [3.0, 8.0]
    step_every_s: [10.0, 25.0]
    decel_mps2: [0.5, 2.5]         # rate limits of the leader
    accel_mps2: [0.5, 2.0]
  init_gap_factor: [0.8, 1.3]      # initial gap = factor * IDM equilibrium gap
  noise:
    spacing_m: 0.2                 # measurement noise added to the records
    speed_mps: 0.05
  reject:
    min_gap_m: 0.5                 # runs whose true gap leaves this range are dropped
    max_gap_m: 150.0
  seed: 42
